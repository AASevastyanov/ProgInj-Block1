name: Block 2 Local CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: host.minikube.internal:5000
  SERVICES: api-gateway user-service queue-service zone-management-service notification-service

jobs:
  validate:
    name: Validate workspace
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Show workspace
        shell: powershell
        run: |
          Write-Host "Validating workspace..."
          Get-ChildItem | Select-Object Name
          if (Test-Path "helm") {
            Write-Host "Helm charts found:"
            Get-ChildItem helm | Select-Object Name
          }
          Write-Host "Validate: OK"

  build-images:
    name: Build and push images
    runs-on: [self-hosted, Windows, X64]
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - queue-service
          - zone-management-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Simulate image build
        shell: powershell
        run: |
          Write-Host "Building image: ${{ matrix.service }}"
          Write-Host "Destination: $env:REGISTRY/qoms/${{ matrix.service }}:${{ github.sha }}"
          Start-Sleep -Seconds 2
          Write-Host "Build complete: ${{ matrix.service }}"

  update-gitops:
    name: Update Helm tags and sync ArgoCD
    runs-on: [self-hosted, Windows, X64]
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Report GitOps state
        shell: powershell
        run: |
          Write-Host "GitOps update stage"
          Write-Host "Image tag: ${{ github.sha }}"
          Write-Host "Would run: scripts/block2/update-image-tags.ps1"
          Write-Host "Would sync ArgoCD application: block2-root"
          Write-Host "GitOps: OK"
