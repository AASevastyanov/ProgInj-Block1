replicaCount: 2

image:
  repository: host.minikube.internal:5000/qoms/user-service
  tag: dev
  pullPolicy: IfNotPresent

command: ["pnpm", "--filter", "@qoms/user-service", "start"]
containerPort: 3001

serviceAccount:
  create: true
  name: user-service

service:
  type: ClusterIP
  port: 3001

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  USER_SERVICE_PORT: "3001"
  POSTGRES_HOST: postgres.qoms-data.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: qoms
  POSTGRES_USER: qoms
  NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,postgres,valkey,mongodb,qoms-kafka-kafka-bootstrap,user-service,zone-management-service,queue-service,notification-service,api-gateway
  no_proxy: localhost,127.0.0.1,.svc,.cluster.local,postgres,valkey,mongodb,qoms-kafka-kafka-bootstrap,user-service,zone-management-service,queue-service,notification-service,api-gateway

secretEnv:
  - name: JWT_SECRET
    secretName: qoms-app-secrets
    secretKey: jwtSecret
  - name: INTERNAL_SERVICE_TOKEN
    secretName: qoms-app-secrets
    secretKey: internalServiceToken
  - name: POSTGRES_PASSWORD
    secretName: qoms-app-secrets
    secretKey: postgresPassword

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "3001"

serviceMonitor:
  enabled: true
  interval: 30s

ingress:
  enabled: false
