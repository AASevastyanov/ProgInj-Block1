replicaCount: 2

image:
  repository: host.minikube.internal:5000/qoms/queue-service
  tag: dev
  pullPolicy: IfNotPresent

command: ["pnpm", "--filter", "@qoms/queue-service", "start"]
containerPort: 3003

serviceAccount:
  create: true
  name: queue-service

service:
  type: ClusterIP
  port: 3003

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 768Mi

env:
  NODE_ENV: production
  QUEUE_SERVICE_PORT: "3003"
  KAFKA_BROKERS: qoms-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  KAFKA_TOPIC: queue-and-occupancy-events
  POSTGRES_HOST: postgres.qoms-data.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: qoms
  POSTGRES_USER: qoms
  REDIS_HOST: valkey.qoms-data.svc.cluster.local
  REDIS_PORT: "6379"
  USER_SERVICE_URL: http://user-service:3001
  ZONE_MANAGEMENT_SERVICE_URL: http://zone-management-service:3002
  NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,postgres,valkey,mongodb,qoms-kafka-kafka-bootstrap,user-service,zone-management-service,queue-service,notification-service,api-gateway
  no_proxy: localhost,127.0.0.1,.svc,.cluster.local,postgres,valkey,mongodb,qoms-kafka-kafka-bootstrap,user-service,zone-management-service,queue-service,notification-service,api-gateway

secretEnv:
  - name: INTERNAL_SERVICE_TOKEN
    secretName: qoms-app-secrets
    secretKey: internalServiceToken
  - name: POSTGRES_PASSWORD
    secretName: qoms-app-secrets
    secretKey: postgresPassword

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "3003"

serviceMonitor:
  enabled: true
  interval: 30s

ingress:
  enabled: false
