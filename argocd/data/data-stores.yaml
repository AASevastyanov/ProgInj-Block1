apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: data-postgres
    app.kubernetes.io/part-of: qoms
spec:
  project: default
  source:
    repoURL: https://github.com/AASevastyanov/ProgInj-Block1.git
    targetRevision: main
    path: k8s/data/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: qoms-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
