apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qoms-api-login
  namespace: qoms-apps
  annotations:
    konghq.com/plugins: qoms-rate-limit-login
  labels:
    app.kubernetes.io/name: qoms-api-login
    app.kubernetes.io/part-of: qoms
spec:
  parentRefs:
    - name: qoms-gateway
      namespace: qoms-platform
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/auth/login
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /auth/login
      backendRefs:
        - name: api-gateway
          port: 3000
---
