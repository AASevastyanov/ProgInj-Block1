apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: notification-service-retry
  namespace: qoms-apps
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: qoms
spec:
  hosts:
    - notification-service
    - notification-service.qoms-apps.svc.cluster.local
  http:
    - route:
        - destination:
            host: notification-service.qoms-apps.svc.cluster.local
            port:
              number: 3005
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream,reset
      timeout: 8s
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: notification-service-circuit-breaker
  namespace: qoms-apps
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: qoms
spec:
  host: notification-service.qoms-apps.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
