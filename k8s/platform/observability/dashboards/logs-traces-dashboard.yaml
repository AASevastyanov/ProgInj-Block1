apiVersion: v1
kind: ConfigMap
metadata:
  name: qoms-logs-traces-dashboard
  namespace: qoms-observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: qoms-logs-traces-dashboard
    app.kubernetes.io/part-of: qoms
data:
  qoms-logs-traces.json: |
    {
      "title": "QOMS Logs and Traces",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "type": "logs",
          "title": "Application logs",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 10},
          "targets": [
            {"expr": "{namespace=\"qoms-apps\"}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Istio destination requests",
          "gridPos": {"x": 0, "y": 10, "w": 12, "h": 8},
          "targets": [
            {"expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"qoms-apps\"}[5m])) by (destination_workload)", "legendFormat": "{{destination_workload}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod restarts",
          "gridPos": {"x": 12, "y": 10, "w": 12, "h": 8},
          "targets": [
            {"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"qoms-apps\"}[10m])) by (pod)", "legendFormat": "{{pod}}"}
          ]
        }
      ]
    }
