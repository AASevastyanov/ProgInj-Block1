apiVersion: v1
kind: ConfigMap
metadata:
  name: qoms-kafka-events-dashboard
  namespace: qoms-observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: qoms-kafka-events-dashboard
    app.kubernetes.io/part-of: qoms
data:
  qoms-kafka-events.json: |
    {
      "title": "QOMS Kafka Event Flow",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Kafka broker readiness",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {"expr": "kube_statefulset_status_replicas_ready{namespace=\"kafka\"}", "legendFormat": "{{statefulset}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Producer service request rate",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [
            {"expr": "sum(rate(qoms_http_requests_total{service=~\"queue-service|zone-management-service\"}[5m])) by (service)", "legendFormat": "{{service}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Notification consumer health proxy",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "targets": [
            {"expr": "sum(rate(qoms_http_requests_total{service=\"notification-service\"}[5m])) by (status_code)", "legendFormat": "{{status_code}}"}
          ]
        }
      ]
    }
